services:
  - type: web
    name: shl-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_index.py && python scripts/build_groups.py --skip-llm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
